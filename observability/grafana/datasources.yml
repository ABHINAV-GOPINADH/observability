apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "traceId[\":\\s]+(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        mapTagNamesEnabled: true
        tags: ['service']
      serviceMap:
        datasourceUid: tempo
      nodeGraph:
        enabled: true

  - name: OpenSearch Logs
    uid: opensearch-logs
    type: opensearch
    access: proxy
    url: http://opensearch:9200
    database: service-logs
    jsonData:
      logMessageField: message
      logLevelField: levelgreater
      timeField: "@timestamp"
      timeInterval: "Daily"

  - name: OpenSearch Traces
    uid: opensearch-traces
    type: opensearch
    access: proxy
    url: http://opensearch:9200
    database: otel-traces
    jsonData:
      timeField: "@timestamp"
      timeInterval: "Daily"
