[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

# === Gateway Service Logs ===
[INPUT]
    Name              tail
    Path              /fluent-bit/logs/gateway-service/*.log
    Parser            json
    Tag               gateway.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB

# === Billing Service Logs ===
[INPUT]
    Name              tail
    Path              /fluent-bit/logs/billing-service/*.log
    Parser            json
    Tag               billing.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB

# === Inventory Service Logs ===
[INPUT]
    Name              tail
    Path              /fluent-bit/logs/inventory-service/*.log
    Parser            json
    Tag               inventory.*
    Refresh_Interval  5
    Mem_Buf_Limit     5MB

# === Enrichment Filter ===
[FILTER]
    Name    modify
    Match   *
    Add     environment development
    Add     cluster local

# === Mask Sensitive Data ===
[FILTER]
    Name    lua
    Match   *
    script  /fluent-bit/etc/mask-sensitive.lua
    call    mask_credit_cards

# === Output to Loki ===
[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      job=fluentbit, service=$TAG[0]
    Label_keys  $traceId,$spanId
    auto_kubernetes_labels on

# === Output to OpenSearch ===
[OUTPUT]
    Name        opensearch
    Match       *
    Host        opensearch
    Port        9200
    Index       service-logs
    Type        _doc
    Suppress_Type_Name On
    tls         Off